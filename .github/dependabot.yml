version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react-ecosystem:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      eslint-ecosystem:
        patterns:
          - 'eslint'
          - 'eslint-config-prettier'
          - 'eslint-plugin-import-x'
          - 'eslint-plugin-react-hooks'
          - '@eslint-react/eslint-plugin'
          - '@eslint/js'
      i18next-ecosystem:
        patterns:
          - 'i18next'
          - 'i18next-fs-backend'
          - 'i18next-http-backend'
          - 'react-i18next'
