name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 'code' will be true if any file OUTSIDE these folders changes
          filters: |
            code:
              - '!**.md'
              - '!.github/**'
              - '!.vscode/**'

  build:
    needs: detect-changes
    # Only run if code changes were detected, OR if this is a push to main/tags (ensuring CI always runs on main)
    if: ${{ needs.detect-changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0

      - name: Prepare for CI
        run: npm ci
      - name: Test standard build (not for integration testing). Will be replaced by a build for integration testing.
        run: npm run build:main
      - name: Build renderer (needed for integration testing of UI)
        run: npm run build:renderer
      - name: Run tests (will rebuild main for integration testing)
        run: xvfb-run npm run test --if-present

  windows-build:
    permissions:
      contents: write
      actions: write
      checks: write

    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0

      - name: Prepare for CI
        run: npm ci

      - name: Get package version
        id: package_version
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches version
        shell: pwsh
        run: |
          $TagVersion = "${{ github.ref_name }}".TrimStart('v')
          $PackageVersion = "${{ steps.package_version.outputs.version }}"
          if ($TagVersion -ne $PackageVersion) {
            Write-Error "Tag version ($TagVersion) does not match package.json version ($PackageVersion)"
            exit 1
          }

      - name: Build the Windows installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Verify build did not modify tracked files
        run: git diff --exit-code
